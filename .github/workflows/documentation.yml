name: Documentation Guard

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  documentation:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate documentation and drift rules
        run: node scripts/check-docs.mjs --base "${{ github.event.pull_request.base.sha }}"

      - name: Validate PR documentation declaration
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-pr-docs.mjs
